<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DewDrop — Ton code de confirmation</title>
</head>
<body style="margin:0;padding:0;background:#0e1020;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e1020;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#161a2e;border-radius:18px;">
          <tr>
            <td style="padding:36px 32px 30px;text-align:center;">
              <div style="font-size:26px;font-weight:300;letter-spacing:2px;color:#ffffff;">DewDrop</div>
              <div style="height:1px;background:rgba(255,255,255,0.08);margin:22px 0;line-height:1px;font-size:0;">&nbsp;</div>
              <div style="font-size:19px;font-weight:500;color:#ffffff;margin-bottom:12px;">Ton code de confirmation</div>
              <div style="font-size:15px;line-height:1.6;color:rgba(255,255,255,0.72);margin-bottom:24px;">
                Saisis ce code dans DewDrop pour confirmer que c'est bien toi.
              </div>
              <div style="display:inline-block;background:rgba(143,183,255,0.14);border:1px solid rgba(143,183,255,0.35);border-radius:12px;padding:16px 28px;font-size:30px;font-weight:600;letter-spacing:8px;color:#ffffff;">{{ .Token }}</div>
              <div style="font-size:12px;line-height:1.6;color:rgba(255,255,255,0.35);margin-top:26px;">
                Tu n'es pas à l'origine de cette demande&nbsp;? Ignore cet email et ne communique ce code à personne.
              </div>
            </td>
          </tr>
        </table>
        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:18px;">DewDrop · contact@heianenterprise.com</div>
      </td>
    </tr>
  </table>
</body>
</html>
